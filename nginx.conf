server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri.html $uri/index.html =404;
  }

  location ~* ^/tools/([a-z0-9-]+)/?$ {
    try_files /tools/$1.html /tools/$1/index.html =404;
  }

  # Add the global language selector/translator to every HTML page.
  sub_filter_once on;
  sub_filter_types text/html;
  sub_filter '</head>' '<script defer src="/language.js?v=20261007-01"></script></head>';
}