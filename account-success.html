<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalTools — Acesso liberado</title><style>body{font-family:Arial,sans-serif;background:#0b0b0d;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{width:min(620px,92vw);background:#151519;border:1px solid #333;border-radius:20px;padding:32px;box-sizing:border-box}h1{font-size:30px}code{background:#09090b;padding:4px 7px;border-radius:6px}a,button{display:inline-block;padding:13px 18px;border-radius:10px;background:#fff;color:#000;text-decoration:none;font-weight:700;border:0;cursor:pointer}.cred{background:#0b0b0d;border:1px solid #333;padding:16px;border-radius:12px;margin:18px 0}.muted{color:#aaa}</style></head><body><main class="box"><h1>Pagamento confirmado.</h1><p>Estamos liberando seu acesso ao GlobalTools.</p><div id="out">Validando pagamento...</div></main><script>(async()=>{const sid=new URLSearchParams(location.search).get("session_id");if(!sid){out.textContent="Sessão de pagamento ausente.";return}const r=await fetch("/api/activate-account",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid})});const j=await r.json();if(!r.ok){out.innerHTML="<p>"+(j.error||"Não foi possível liberar o acesso.")+"</p>";return}let html="<p><b>Acesso liberado!</b></p>";if(j.generatedPassword){html+="<div class='cred'><div>E-mail: <code>"+j.user.email+"</code></div><div>Senha inicial: <code>"+j.generatedPassword+"</code></div><p class='muted'>Guarde esta senha. Depois você poderá entrar normalmente pelo login.</p></div>"}html+="<a href='/account.html'>Entrar no meu painel</a>";out.innerHTML=html})()</script></body></html>
