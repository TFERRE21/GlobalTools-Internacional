name: Validate GlobalTools International

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: |
          node --check server.js
          node --check gateway.js
          node --check app.js
      - name: Smoke test domain-aware SEO endpoints
        env:
          PORT: 3400
          PUBLIC_SITE_URL: https://globaltoolsnow.com
        run: |
          node server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3400/robots.txt -o /tmp/robots.txt; then break; fi
            sleep 1
          done
          grep -F "Sitemap: https://globaltoolsnow.com/sitemap.xml" /tmp/robots.txt
          curl -fsS http://127.0.0.1:3400/sitemap.xml -o /tmp/sitemap.xml
          grep -F "https://globaltoolsnow.com/tools/word-counter.html" /tmp/sitemap.xml
          curl -fsS http://127.0.0.1:3400/products/small-business-finance-dashboard.html | grep -F "https://globaltoolsnow.com/products/small-business-finance-dashboard.html"
      - name: Smoke test public-domain fallback without environment variable
        env:
          PORT: 3402
        run: |
          env -u PUBLIC_SITE_URL PORT=3402 node server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3402/robots.txt -o /tmp/robots-default.txt; then break; fi
            sleep 1
          done
          grep -F "Sitemap: https://globaltoolsnow.com/sitemap.xml" /tmp/robots-default.txt
          curl -fsS http://127.0.0.1:3402/sitemap.xml -o /tmp/sitemap-default.xml
          grep -F "https://globaltoolsnow.com/tools/word-counter.html" /tmp/sitemap-default.xml
          if grep -F "127.0.0.1" /tmp/sitemap-default.xml; then
            echo "Internal localhost URLs must not appear in the public sitemap"
            exit 1
          fi
      - name: Smoke test production start command
        env:
          PORT: 3500
          CORE_PORT: 3501
          PUBLIC_SITE_URL: https://globaltoolsnow.com
          GLOBALTOOLS_DATA_DIR: /tmp/globaltools-international-ci-data
        run: |
          npm start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3500/api/me -o /tmp/me.json; then break; fi
            sleep 1
          done
          grep -F '"authenticated":false' /tmp/me.json
          curl -fsS http://127.0.0.1:3500/robots.txt | grep -F "Sitemap: https://globaltoolsnow.com/sitemap.xml"
          curl -fsS http://127.0.0.1:3500/ads.txt -o /tmp/ads.txt
          grep -Fx "google.com, pub-6472882150880001, DIRECT, f08c47fec0942fa0" /tmp/ads.txt
          curl -fsS http://127.0.0.1:3500/ | grep -F "GlobalTools — Free Online Tools"
          curl -fsS http://127.0.0.1:3500/store.html -o /tmp/store.html
          grep -F 'adsbygoogle.js?client=ca-pub-6472882150880001' /tmp/store.html
          test "$(grep -o 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' /tmp/store.html | wc -l)" -eq 1
          curl -fsS http://127.0.0.1:3500/contato.html -o /tmp/contact.html
          curl -fsS http://127.0.0.1:3500/privacy.html -o /tmp/privacy.html
          curl -fsS http://127.0.0.1:3500/refund.html -o /tmp/refund.html
          grep -F 'id="contactForm"' /tmp/contact.html
          if grep -E 'globaltools-international\.example|contato@.*\.example|OOLIVO' /tmp/contact.html /tmp/privacy.html /tmp/refund.html; then
            echo "Placeholder contact details or legacy brand found on public policy pages"
            exit 1
          fi
          grep -F 'Google AdSense' /tmp/privacy.html
          grep -F 'globaltoolsnow.com' /tmp/privacy.html

          # Localized landing pages are distinct, canonical URLs with reciprocal hreflang.
          curl -fsS http://127.0.0.1:3500/pt/ -o /tmp/home-pt.html
          curl -fsS http://127.0.0.1:3500/es/ -o /tmp/home-es.html
          curl -fsS http://127.0.0.1:3500/fr/ -o /tmp/home-fr.html
          grep -F '<html lang="pt-BR">' /tmp/home-pt.html
          grep -F 'rel="canonical" href="https://globaltoolsnow.com/pt/"' /tmp/home-pt.html
          grep -F 'hreflang="x-default" href="https://globaltoolsnow.com/"' /tmp/home-fr.html
          # High-intent tool pages must have translated content, canonical URLs and hreflang links.
          curl -fsS http://127.0.0.1:3500/pt/tools/word-to-pdf.html -o /tmp/word-to-pdf-pt.html
          curl -fsS http://127.0.0.1:3500/es/tools/pdf-to-word.html -o /tmp/pdf-to-word-es.html
          curl -fsS http://127.0.0.1:3500/fr/tools/compress-pdf.html -o /tmp/compress-pdf-fr.html
          grep -F '<html lang="pt-BR">' /tmp/word-to-pdf-pt.html
          grep -F '<title>Converter Word em PDF Grátis | GlobalTools</title>' /tmp/word-to-pdf-pt.html
          grep -F 'href="https://globaltoolsnow.com/pt/tools/word-to-pdf.html"' /tmp/word-to-pdf-pt.html
          grep -F 'rel="icon" href="/icon.svg"' /tmp/word-to-pdf-pt.html
          grep -F '"logo":{"@type":"ImageObject","url":"https://globaltoolsnow.com/icon.svg"' /tmp/word-to-pdf-pt.html
          grep -F 'Ferramentas online gratuitas para tarefas do dia a dia.' /tmp/word-to-pdf-pt.html
          if grep -F 'href="/tools/word-to-text.html"' /tmp/word-to-pdf-pt.html; then
            echo "Localized pages should not recommend untranslated English tools"
            exit 1
          fi
          grep -F 'Extrae texto de un PDF' /tmp/pdf-to-word-es.html
          grep -F '<title>PDF a Word Gratis Online | GlobalTools</title>' /tmp/pdf-to-word-es.html
          grep -F 'Convierte PDF a Word gratis online' /tmp/pdf-to-word-es.html
          grep -F 'La méthode actuelle ne réduit pas la résolution' /tmp/compress-pdf-fr.html
          grep -F '<title>Compresser PDF Gratuit en Ligne | GlobalTools</title>' /tmp/compress-pdf-fr.html
          grep -F 'Compressez un PDF gratuitement en ligne' /tmp/compress-pdf-fr.html
          # Sitemap must be valid XML and list the localized routes with language alternates.
          curl -fsS http://127.0.0.1:3500/sitemap.xml -o /tmp/sitemap.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/sitemap.xml").getroot()
          ns = {
              "s": "http://www.sitemaps.org/schemas/sitemap/0.9",
              "xhtml": "http://www.w3.org/1999/xhtml",
          }
          urls = root.findall("s:url", ns)
          locs = [u.findtext("s:loc", namespaces=ns) for u in urls]
          assert "https://globaltoolsnow.com/pt/" in locs
          assert "https://globaltoolsnow.com/es/" in locs
          assert "https://globaltoolsnow.com/fr/" in locs
          for path in [
              "pt/tools/word-to-pdf.html",
              "es/tools/word-to-pdf.html",
              "fr/tools/word-to-pdf.html",
          ]:
              assert "https://globaltoolsnow.com/" + path in locs, path
          english_word = next(u for u in urls if u.findtext("s:loc", namespaces=ns) == "https://globaltoolsnow.com/tools/word-to-pdf.html")
          alternates = {x.attrib["hreflang"]: x.attrib["href"] for x in english_word.findall("xhtml:link", ns)}
          assert alternates.get("pt-BR") == "https://globaltoolsnow.com/pt/tools/word-to-pdf.html"
          assert alternates.get("es") == "https://globaltoolsnow.com/es/tools/word-to-pdf.html"
          assert alternates.get("fr") == "https://globaltoolsnow.com/fr/tools/word-to-pdf.html"
          assert alternates.get("x-default") == "https://globaltoolsnow.com/tools/word-to-pdf.html"
          assert len(urls) >= 160, len(urls)
          print("Localized sitemap OK:", len(urls), "URLs")
          PY
          curl -fsS http://127.0.0.1:3500/tools/compress-pdf.html -o /tmp/compress-pdf.html
          grep -F 'This tool re-saves a PDF using a browser-based PDF library.' /tmp/compress-pdf.html
          grep -F '<title>Compress PDF Online Free | GlobalTools</title>' /tmp/compress-pdf.html
          grep -F 'Try this free online PDF compressor to reduce file size.' /tmp/compress-pdf.html
          curl -fsS http://127.0.0.1:3500/tools/word-to-pdf.html -o /tmp/word-to-pdf-en.html
          grep -F '<title>Word to PDF Converter Free Online | GlobalTools</title>' /tmp/word-to-pdf-en.html
          grep -F 'Use this free online Word to PDF converter' /tmp/word-to-pdf-en.html
          curl -fsS http://127.0.0.1:3500/tools/pdf-to-word.html -o /tmp/pdf-to-word-en.html
          grep -F '<title>PDF to Word Converter Free Online | GlobalTools</title>' /tmp/pdf-to-word-en.html
          # Avoid loading gtag.js twice on tool pages; one library load configures both GA4 and Google Ads.
          test "$(grep -o 'googletagmanager.com/gtag/js?id=' /tmp/compress-pdf.html | wc -l)" -eq 1
          grep -F 'gtag("config","G-061NQ52GBQ");gtag("config","AW-17240722145");' /tmp/compress-pdf.html
          if grep -F 'language.js?v=20261016-01' /tmp/compress-pdf.html; then
            echo "Tool pages should use native localized links instead of the translation loader"
            exit 1
          fi
          # Versioned local JS/CSS can be cached for repeat visits; URLs change when assets change.
          curl -fsS -D /tmp/app-headers -o /dev/null 'http://127.0.0.1:3500/app.js?v=20261016-01'
          grep -iF 'Cache-Control: public, max-age=31536000, immutable' /tmp/app-headers
          curl -fsS http://127.0.0.1:3500/account.html -o /tmp/account.html
          if grep -F 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' /tmp/account.html; then
            echo "AdSense must not load on account pages"
            exit 1
          fi
          grep -F 'name="robots" content="noindex,nofollow"' /tmp/account.html
          curl -fsS http://127.0.0.1:3500/products/cash-flow-planner-success.html -o /tmp/purchase-success.html
          if grep -F 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' /tmp/purchase-success.html; then
            echo "AdSense must not load on purchase-success pages"
            exit 1
          fi
          grep -F 'name="robots" content="noindex,nofollow"' /tmp/purchase-success.html
          ticket_response=$(curl -fsS -X POST http://127.0.0.1:3500/api/support/ticket -H 'Content-Type: application/json' -d '{"name":"CI Tester","email":"ci@example.com","message":"Automated support ticket storage test","page":"/contato.html"}')
          echo "$ticket_response" | grep -F '"ok":true'
          test -s /tmp/globaltools-international-ci-data/support-tickets.json
