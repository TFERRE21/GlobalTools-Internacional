name: Validate GlobalTools International

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: |
          node --check server.js
          node --check gateway.js
          node --check app.js
      - name: Smoke test domain-aware SEO endpoints
        env:
          PORT: 3400
          PUBLIC_SITE_URL: https://globaltoolsnow.com
        run: |
          node server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3400/robots.txt -o /tmp/robots.txt; then break; fi
            sleep 1
          done
          grep -F "Sitemap: https://globaltoolsnow.com/sitemap.xml" /tmp/robots.txt
          curl -fsS http://127.0.0.1:3400/sitemap.xml -o /tmp/sitemap.xml
          grep -F "https://globaltoolsnow.com/tools/word-counter.html" /tmp/sitemap.xml
          curl -fsS http://127.0.0.1:3400/products/small-business-finance-dashboard.html | grep -F "https://globaltoolsnow.com/products/small-business-finance-dashboard.html"
      - name: Smoke test public-domain fallback without environment variable
        env:
          PORT: 3402
        run: |
          env -u PUBLIC_SITE_URL PORT=3402 node server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3402/robots.txt -o /tmp/robots-default.txt; then break; fi
            sleep 1
          done
          grep -F "Sitemap: https://globaltoolsnow.com/sitemap.xml" /tmp/robots-default.txt
          curl -fsS http://127.0.0.1:3402/sitemap.xml -o /tmp/sitemap-default.xml
          grep -F "https://globaltoolsnow.com/tools/word-counter.html" /tmp/sitemap-default.xml
          if grep -F "127.0.0.1" /tmp/sitemap-default.xml; then
            echo "Internal localhost URLs must not appear in the public sitemap"
            exit 1
          fi
      - name: Smoke test production start command
        env:
          PORT: 3500
          CORE_PORT: 3501
          PUBLIC_SITE_URL: https://globaltoolsnow.com
          GLOBALTOOLS_DATA_DIR: /tmp/globaltools-international-ci-data
        run: |
          npm start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3500/api/me -o /tmp/me.json; then break; fi
            sleep 1
          done
          grep -F '"authenticated":false' /tmp/me.json
          curl -fsS http://127.0.0.1:3500/robots.txt | grep -F "Sitemap: https://globaltoolsnow.com/sitemap.xml"
          curl -fsS http://127.0.0.1:3500/ads.txt -o /tmp/ads.txt
          grep -Fx "google.com, pub-6472882150880001, DIRECT, f08c47fec0942fa0" /tmp/ads.txt
          curl -fsS http://127.0.0.1:3500/ | grep -F "GlobalTools — Free Online Tools"
          curl -fsS http://127.0.0.1:3500/store.html -o /tmp/store.html
          grep -F 'adsbygoogle.js?client=ca-pub-6472882150880001' /tmp/store.html
          test "$(grep -o 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' /tmp/store.html | wc -l)" -eq 1
          curl -fsS http://127.0.0.1:3500/contato.html -o /tmp/contact.html
          curl -fsS http://127.0.0.1:3500/privacy.html -o /tmp/privacy.html
          curl -fsS http://127.0.0.1:3500/refund.html -o /tmp/refund.html
          grep -F 'id="contactForm"' /tmp/contact.html
          if grep -E 'globaltools-international\.example|contato@.*\.example|OOLIVO' /tmp/contact.html /tmp/privacy.html /tmp/refund.html; then
            echo "Placeholder contact details or legacy brand found on public policy pages"
            exit 1
          fi
          grep -F 'Google AdSense' /tmp/privacy.html
          grep -F 'globaltoolsnow.com' /tmp/privacy.html
          curl -fsS http://127.0.0.1:3500/tools/compress-pdf.html -o /tmp/compress-pdf.html
          grep -F 'This tool re-saves a PDF using a browser-based PDF library.' /tmp/compress-pdf.html
          curl -fsS http://127.0.0.1:3500/account.html -o /tmp/account.html
          if grep -F 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' /tmp/account.html; then
            echo "AdSense must not load on account pages"
            exit 1
          fi
          ticket_response=$(curl -fsS -X POST http://127.0.0.1:3500/api/support/ticket -H 'Content-Type: application/json' -d '{"name":"CI Tester","email":"ci@example.com","message":"Automated support ticket storage test","page":"/contato.html"}')
          echo "$ticket_response" | grep -F '"ok":true'
          test -s /tmp/globaltools-international-ci-data/support-tickets.json
