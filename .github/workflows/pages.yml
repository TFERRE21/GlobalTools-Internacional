name: Validate GlobalTools International

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: |
          node --check server.js
          node --check gateway.js
          node --check app.js
      - name: Smoke test domain-aware SEO endpoints
        env:
          PORT: 3400
          PUBLIC_SITE_URL: https://globaltools.example
        run: |
          node server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3400/robots.txt -o /tmp/robots.txt; then break; fi
            sleep 1
          done
          grep -F "Sitemap: https://globaltools.example/sitemap.xml" /tmp/robots.txt
          curl -fsS http://127.0.0.1:3400/sitemap.xml -o /tmp/sitemap.xml
          grep -F "https://globaltools.example/tools/word-counter.html" /tmp/sitemap.xml
          curl -fsS http://127.0.0.1:3400/products/small-business-finance-dashboard.html | grep -F "https://globaltools.example/products/small-business-finance-dashboard.html"
      - name: Smoke test public-domain fallback without environment variable
        env:
          PORT: 3402
        run: |
          env -u PUBLIC_SITE_URL PORT=3402 node server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3402/robots.txt -o /tmp/robots-default.txt; then break; fi
            sleep 1
          done
          grep -F "Sitemap: https://globaltoolsnow.com/sitemap.xml" /tmp/robots-default.txt
          curl -fsS http://127.0.0.1:3402/sitemap.xml -o /tmp/sitemap-default.xml
          grep -F "https://globaltoolsnow.com/tools/word-counter.html" /tmp/sitemap-default.xml
          if grep -F "127.0.0.1" /tmp/sitemap-default.xml; then
            echo "Internal localhost URLs must not appear in the public sitemap"
            exit 1
          fi
      - name: Smoke test production start command
        env:
          PORT: 3500
          CORE_PORT: 3501
          PUBLIC_SITE_URL: https://globaltools.example
          GLOBALTOOLS_DATA_DIR: /tmp/globaltools-international-ci-data
        run: |
          npm start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3500/api/me -o /tmp/me.json; then break; fi
            sleep 1
          done
          grep -F '"authenticated":false' /tmp/me.json
          curl -fsS http://127.0.0.1:3500/robots.txt | grep -F "Sitemap: https://globaltools.example/sitemap.xml"
          curl -fsS http://127.0.0.1:3500/ads.txt -o /tmp/ads.txt
          grep -Fx "google.com, pub-6472882150880001, DIRECT, f08c47fec0942fa0" /tmp/ads.txt
          curl -fsS http://127.0.0.1:3500/ | grep -F "GlobalTools — Free Online Tools"
          curl -fsS http://127.0.0.1:3500/store.html -o /tmp/store.html
          grep -F 'adsbygoogle.js?client=ca-pub-6472882150880001' /tmp/store.html
          test "$(grep -o 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' /tmp/store.html | wc -l)" -eq 1
