name: Build PRO Finance Product

on:
  push:
    paths:
      - "scripts/build_finance_product.py"
      - ".github/workflows/build-finance-product.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook engine
        run: python -m pip install --upgrade openpyxl

      - name: Generate PRO workbook
        run: python scripts/build_finance_product.py

      - name: Commit generated product
        run: |
          git config user.name "GlobalTools Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/GlobalTools-Small-Business-Finance-Dashboard-PRO.xlsx products/GlobalTools-Cash-Flow-Planner-PRO.xlsx products/GlobalTools-Freelancer-Business-Kit-PRO.xlsx
          if git diff --cached --quiet; then
            echo "Workbook is already up to date."
          else
            git commit -m "Build PRO finance workbook [skip ci]"
            git push
          fi
