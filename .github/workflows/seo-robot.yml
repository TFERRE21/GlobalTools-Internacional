name: SEO robot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax
        run: node --check scripts/seo-robot.js
      - name: Run SEO research
        run: node scripts/seo-robot.js
      - name: Commit SEO catalog and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-data/keyword-opportunities.json seo-data/robot-state.json sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): refresh keyword research and sitemap"
            git push
          else
            echo "No SEO changes to commit"
          fi
