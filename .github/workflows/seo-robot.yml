name: SEO and marketing content robot
on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"
permissions:
  contents: write
concurrency:
  group: globaltools-content-robots
  cancel-in-progress: false
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate scripts
        run: |
          node --check scripts/seo-robot.js
          node --check scripts/marketing-robot.js
          node --check server.js
          node --check gateway.js
      - name: Refresh SEO research and sitemap
        run: node scripts/seo-robot.js
      - name: Prepare daily organic marketing pack
        run: node scripts/marketing-robot.js
      # Bluesky publishing runs only on the VPS through gateway.js.
      # BLUESKY_HANDLE and BLUESKY_APP_PASSWORD are read from VPS environment variables,
      # never from GitHub Actions secrets.
      - name: Commit generated catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-data/keyword-opportunities.json seo-data/robot-state.json sitemap.xml robots.txt marketing/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(growth): refresh SEO data and daily marketing pack"
            git push
          else
            echo "No content changes to commit"
          fi
